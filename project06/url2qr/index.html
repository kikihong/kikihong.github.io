<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="URL을 입력하여 손쉽게 고화질 QR코드를 생성하고 JPG 파일로 다운로드할 수 있는 스마트 QR 생성기입니다.">
  <title>QR Studio - 고화질 QR코드 생성 & JPG 다운로드</title>
  
  <!-- Favicon -->
  <link rel="icon" href="img/logo.png" type="image/png">

  <!-- Google Fonts: Plus Jakarta Sans & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="state-initial">
  <!-- Dynamic Ambient Background -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>
  <div class="grid-overlay"></div>

  <!-- Header Section -->
  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="logo-link" id="logoBtn" title="새로 만들기 / 처음으로">
        <img src="img/logo.png" alt="QR Studio Logo" class="logo-img" id="logoImg" onerror="this.src='image/logo.png'">
        <div class="logo-badge-group">
          <span class="logo-title">QR Studio</span>
          <span class="logo-badge">Pro</span>
        </div>
      </a>
    </div>

    <!-- Navigation Switcher (QR코드 / URL단축) -->
    <nav class="nav-switcher" aria-label="서비스 전환">
      <a href="index.html" class="nav-tab active" id="navQrBtn" title="현재 서비스: QR코드 생성기">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>QR코드</span>
      </a>
      <a href="../urlShort/index.html" class="nav-tab" id="navShortBtn" title="URL 단축기로 이동">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>URL단축</span>
      </a>
    </nav>
    
    <div class="header-right">
      <button id="resetHeaderBtn" class="glass-btn small-btn" title="초기 화면으로 이동">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>새로 만들기</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="main-wrapper" id="mainWrapper">

    <!-- Center QR Display Area (Appears when QR is generated) -->
    <section class="qr-display-section" id="qrDisplaySection" aria-live="polite">
      <div class="qr-presentation-card" id="qrInteractiveCard" role="button" tabindex="0" title="클릭하여 JPG 다운로드">
        <!-- Interactive Ripple Canvas for Click Effect -->
        <canvas id="clickRippleCanvas" class="ripple-canvas"></canvas>

        <div class="qr-code-frame" id="qrCodeFrame">
          <div id="qrcodeCanvasContainer" class="qrcode-inner-container"></div>
          
          <!-- Hover Overlay Guide -->
          <div class="qr-hover-overlay" id="qrHoverOverlay">
            <div class="download-pill">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span>클릭하여 JPG 다운로드</span>
            </div>
          </div>
        </div>

        <div class="qr-card-footer">
          <div class="qr-click-prompt">
            <span class="pulse-dot"></span>
            <span>QR코드를 클릭하면 JPG 파일로 저장됩니다</span>
          </div>
        </div>
      </div>

      <!-- Quick Action Toolbar -->
      <div class="qr-action-toolbar" id="qrActionToolbar">
        <div class="url-preview-pill" id="urlPreviewPill" title="클릭 시 링크 복사">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span class="url-text" id="activeUrlText">https://example.com</span>
          <span class="copy-hint-text">복사</span>
        </div>

        <div class="button-group">
          <button id="downloadJpgBtn" class="glass-btn primary-action-btn" title="고화질 JPG 다운로드">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>JPG 저장</span>
          </button>
          
          <button id="copyQrImageBtn" class="glass-btn secondary-action-btn" title="클립보드에 이미지 복사">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>이미지 복사</span>
          </button>

          <button id="openWebBtn" class="glass-btn secondary-action-btn" title="새 탭에서 열기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            <span>페이지 열기</span>
          </button>
        </div>
      </div>
    </section>

    <!-- URL Input Section (Transitions smoothly from Center to Bottom) -->
    <section class="url-input-section" id="urlInputSection">
      <div class="input-hero-header" id="inputHeroHeader">
        <div class="sparkle-tag">
          <span class="sparkle-icon">✨</span>
          <span>Fast & Clean QR Generator</span>
        </div>
        <h1 class="hero-title">어떤 URL이든 즉시 QR코드로</h1>
        <p class="hero-desc">주소를 입력하고 확인을 누르면 정중앙에 고화질 QR코드가 생성됩니다.</p>
      </div>

      <div class="input-dock-container">
        <form class="url-input-form" id="urlForm" onsubmit="return false;">
          <div class="input-glow-border"></div>
          <div class="input-field-wrapper">
            <div class="input-prefix-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            </div>
            
            <input 
              type="text" 
              id="urlInput" 
              class="url-input" 
              placeholder="변환할 URL 주소를 입력하세요 (예: naver.com)" 
              autocomplete="off" 
              spellcheck="false"
              required 
            />

            <button type="button" id="clearInputBtn" class="clear-input-btn" title="입력 내용 지우기" aria-label="입력 지우기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>

            <button type="submit" id="submitBtn" class="submit-action-btn">
              <span class="btn-text">확인</span>
              <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </div>
        </form>

        <!-- Quick Recommend Chips (Visible in Initial state) -->
        <div class="quick-chip-tray" id="quickChipTray">
          <span class="chip-title">빠른 입력 :</span>
          <div class="chips-list">
            <button type="button" class="sample-chip" data-url="https://naver.com">
              <span class="chip-dot naver-dot"></span>네이버
            </button>
            <button type="button" class="sample-chip" data-url="https://google.com">
              <span class="chip-dot google-dot"></span>구글
            </button>
            <button type="button" class="sample-chip" data-url="https://youtube.com">
              <span class="chip-dot youtube-dot"></span>유튜브
            </button>
            <button type="button" class="sample-chip" data-url="https://instagram.com">
              <span class="chip-dot insta-dot"></span>인스타그램
            </button>
            <button type="button" class="sample-chip" data-url="https://github.com">
              <span class="chip-dot github-dot"></span>깃허브
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="assertive"></div>

  <!-- Local QR Engine Script -->
  <script src="js/qrcode.min.js"></script>
  <!-- Main Application Logic -->
  <script src="app.js"></script>
</body>
</html>
