<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="비즈니스, 스포츠, 문화 등 관심 분야의 최신 헤드라인을 실시간으로 확인하는 맞춤형 뉴스 리더">
  <title>PulseNews | 나만의 맞춤형 뉴스 리더</title>
  <!-- Google Fonts: Pretendard & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2'/></svg>">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation / Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
            <path d="M18 14h-8"/>
            <path d="M15 18h-5"/>
            <path d="M10 6h8v4h-8V6Z"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Pulse<span class="highlight">News</span></span>
          <span class="brand-tagline">맞춤형 실시간 뉴스 리더</span>
        </div>
      </div>

      <div class="header-meta">
        <span class="live-indicator">
          <span class="pulse-dot"></span>
          실시간 피드 연동
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-container">
    
    <!-- Hero / Control Section -->
    <section class="control-panel" aria-labelledby="control-heading">
      <div class="control-content">
        <div class="control-intro">
          <h1 id="control-heading" class="control-title">관심 있는 주제를 선택하고<br><span class="gradient-text">맞춤형 헤드라인</span>을 확인하세요</h1>
          <p class="control-desc">비즈니스, 스포츠, 문화 분야의 최신 톱뉴스를 실시간으로 큐레이션해 드립니다.</p>
        </div>

        <!-- Topic Multi-Select Box -->
        <div class="filter-wrapper">
          <div class="category-selectors" role="group" aria-label="뉴스 주제 선택">
            
            <!-- Business -->
            <label class="topic-chip active" data-category="business">
              <input type="checkbox" name="topic" value="business" checked id="chk-business">
              <span class="chip-icon">💼</span>
              <span class="chip-label">비즈니스</span>
              <span class="chip-check">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
            </label>

            <!-- Sports -->
            <label class="topic-chip active" data-category="sports">
              <input type="checkbox" name="topic" value="sports" checked id="chk-sports">
              <span class="chip-icon">⚽</span>
              <span class="chip-label">스포츠</span>
              <span class="chip-check">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
            </label>

            <!-- Culture -->
            <label class="topic-chip active" data-category="culture">
              <input type="checkbox" name="topic" value="culture" checked id="chk-culture">
              <span class="chip-icon">🎭</span>
              <span class="chip-label">문화</span>
              <span class="chip-check">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
            </label>

          </div>

          <!-- Action Buttons -->
          <div class="action-bar">
            <button id="btn-select-all" class="btn-text" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
              전체 선택/해제
            </button>

            <!-- '뉴스 보기' 버튼 -->
            <button id="btn-fetch-news" class="btn-primary" type="button" aria-label="뉴스 보기">
              <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <span class="btn-text-label">뉴스 보기</span>
              <span class="spinner-inline hidden" id="btn-spinner"></span>
            </button>
          </div>
        </div>

      </div>
    </section>

    <!-- News Feed Section -->
    <section class="feed-section" aria-live="polite">
      
      <!-- Feed Meta / Status Bar -->
      <div class="feed-meta-bar" id="feed-meta-bar">
        <div class="meta-left">
          <span class="meta-title" id="feed-status-title">추천 헤드라인</span>
          <span class="meta-count" id="feed-count-badge">0건의 기사</span>
        </div>
        <div class="meta-right">
          <span class="meta-notice" id="feed-update-time">선택된 주제의 기사를 불러옵니다</span>
        </div>
      </div>

      <!-- News Cards Grid (Requirement 5: 반응형 그리드 & 깔끔한 흰색 카드/그림자) -->
      <div id="news-grid" class="news-grid" role="region" aria-label="뉴스 기사 목록">
        <!-- Javascript dynamically injects article cards or skeletons here -->
      </div>

      <!-- Infinite Scroll Trigger Sentinel & Loading Indicator (Requirement 4) -->
      <div id="infinite-scroll-container" class="infinite-scroll-container">
        <div id="infinite-loader" class="infinite-loader hidden">
          <div class="modern-spinner"></div>
          <span>다음 기사 10건을 불러오는 중...</span>
        </div>
        <div id="end-of-feed" class="end-of-feed hidden">
          <span>모든 기사를 불러왔습니다 ✨</span>
        </div>
        <!-- Sentinel Element for IntersectionObserver -->
        <div id="scroll-sentinel" class="scroll-sentinel"></div>
      </div>

    </section>

  </main>

  <!-- Article Detail Modal Popup (Requirement 3: 버튼 누르면 팝업으로 본문 열기) -->
  <div id="article-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card" id="modal-content">
      
      <!-- Modal Header -->
      <div class="modal-header">
        <div class="modal-meta">
          <span id="modal-category" class="category-badge">카테고리</span>
          <span id="modal-publisher" class="publisher-badge">언론사</span>
          <span id="modal-date" class="date-badge">작성일시</span>
        </div>
        <button id="modal-close-btn" class="modal-close" aria-label="팝업 닫기">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="modal-body">
        <h2 id="modal-title" class="modal-headline">기사 제목</h2>
        
        <div class="modal-image-wrapper">
          <img id="modal-image" src="" alt="기사 대표 이미지" class="modal-img">
        </div>

        <div class="modal-article-body" id="modal-text">
          <!-- Article text inserted dynamically -->
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer">
        <button id="modal-copy-link" class="btn-secondary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          기사 링크 복사
        </button>
        <a id="modal-origin-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-primary-action">
          원문 기사 보러가기
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </a>
      </div>

    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <!-- Back to Top Floating Button -->
  <button id="btn-back-to-top" class="back-to-top hidden" aria-label="맨 위로 스크롤">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Script File -->
  <script src="app.js"></script>
</body>
</html>
